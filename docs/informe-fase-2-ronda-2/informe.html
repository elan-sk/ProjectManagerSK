<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe Fase 2 — Ronda 2</title>
<!--
  PLANTILLA del informe de resultados (skill modos-de-trabajo, sección
  "Informe de resultados"). NO se edita el diseño ni el script: solo se
  reemplaza el JSON de <script id="informe-data"> (y opcionalmente <title>).
  Formato del JSON: ver SKILL.md. Los comentarios admiten capturas pegadas (Ctrl+V); van en el .json descargado como data URLs. El JSON no puede contener la secuencia
  "</script".
-->
<style>
  :root { --bg:#f4f8f8; --card:#fff; --ink:#0f2a33; --muted:#5b7078; --line:#d5e3e4; --accent:#0a6b78; --ok:#17664e; --warn:#8a5a00; --bad:#a3252f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1b20; --card:#14272e; --ink:#e6f1f1; --muted:#9db4ba; --line:#254149; --accent:#6fd0dc; --ok:#5fd0a3; --warn:#f0c060; --bad:#ff8a93; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .resumen { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .track { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--ok); transition: width .25s; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-top: 8px; font-size: .92rem; }
  .row .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: .88rem; }
  button.btn:hover { border-color: var(--accent); }
  label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); font-size: .88rem; }
  #msg { color: var(--ok); font-size: .85rem; min-height: 1.2em; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  .item.done { opacity: .66; }
  .item input[type=checkbox] { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--ok); cursor: pointer; }
  .item h3 { margin: 0; font-size: 1rem; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .item .body { grid-column: 2; font-size: .93rem; }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap; }
  .t-hecho { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .t-parcial { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .t-no_hecho { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .paso { margin: 6px 0; }
  ol { margin: 6px 0 6px 18px; padding: 0; }
  li { margin: 2px 0; }
  .exp { margin-top: 6px; padding: 6px 10px; border-left: 3px solid var(--ok); background: color-mix(in srgb, var(--ok) 9%, transparent); border-radius: 0 8px 8px 0; }
  .probar { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .probar a { color: var(--accent); font-weight: 600; text-decoration: none; border: 1px solid var(--accent); border-radius: 8px; padding: 3px 10px; }
  .probar a:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .probar small { color: var(--muted); }
  textarea { width: 100%; min-height: 58px; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: .9rem; padding: 8px 10px; resize: vertical; }
  textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .thumbs figure { margin: 0; position: relative; }
  .thumbs img { display: block; max-width: 160px; max-height: 120px; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
  .thumbs figure.big { flex-basis: 100%; }
  .thumbs figure.big img { max-width: 100%; max-height: none; cursor: zoom-out; }
  .thumbs .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 99px; border: 0; background: rgba(15,42,51,.75); color: #fff; cursor: pointer; line-height: 1; font-size: 14px; }
  code { background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 1px 6px; border-radius: 5px; font-size: .88em; }
  .hide { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Informe</h1>
  <p class="sub" id="sub"></p>
  <div class="resumen hide" id="resumen"></div>

  <div class="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="row">
      <span id="count">0 de 0 probadas</span>
      <span class="grp">

    </div>
    <div id="msg" role="status"></div>
  </div>

  <div id="root"></div>
</main>

<script>
// <pure>
// Funciones puras (sin DOM): se prueban aparte con node.
function resolveLink(baseUrl, link) {
  if (!link) return "";
  if (/^(https?|file):/i.test(link)) return link;
  const base = String(baseUrl || "").replace(/\/+$/, "");
  return base + (link.startsWith("/") ? link : "/" + link);
}
// Reduce una imagen para que quepan varias en el navegador (localStorage ~5 MB).
function fitSize(w, h, max) {
  const k = Math.min(1, max / Math.max(w, h));
  return { w: Math.max(1, Math.round(w * k)), h: Math.max(1, Math.round(h * k)) };
}
function buildCommentsText(data, state) {
  const lines = [`COMENTARIOS — ${data.titulo} (${data.fecha})`];
  for (const it of data.items) {
    const note = (state.notes[it.id] || "").trim();
    const imgs = (state.images[it.id] || []).length;
    const done = !!state.checks[it.id];
    if (!note && !done && !imgs) continue;
    lines.push("", `[${it.id}] ${it.titulo} — probado: ${done ? "sí" : "no"}`);
    if (note) lines.push(...note.split("\n").map((l) => "  " + l));
    if (imgs) lines.push(`  [${imgs} captura(s) adjunta(s): usa «Descargar» para enviarlas]`);
  }
  if (lines.length === 1) lines.push("", "(sin comentarios ni pruebas marcadas)");
  return lines.join("\n");
}
function buildCommentsJson(data, state, now) {
  return {
    tema: data.tema, titulo: data.titulo, fecha: data.fecha, exportadoEn: now,
    items: data.items
      .filter((it) => (state.notes[it.id] || "").trim() || state.checks[it.id] || (state.images[it.id] || []).length)
      .map((it) => {
        const out = { id: it.id, titulo: it.titulo, estado: it.estado, probado: !!state.checks[it.id], comentario: (state.notes[it.id] || "").trim() };
        const imgs = state.images[it.id] || [];
        if (imgs.length) out.imagenes = imgs; // data URLs (jpeg)
        return out;
      }),
  };
}
// </pure>

const DATA = JSON.parse(document.getElementById("informe-data").textContent);
const KEY = `informe:${DATA.tema}:${DATA.fecha}`;
let state = { checks: {}, notes: {}, images: {} };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {} };
const $ = (id) => document.getElementById(id);
const ESTADO = { hecho: "Hecho", parcial: "Parcial", no_hecho: "No hecho" };

document.title = DATA.titulo;
$("titulo").textContent = DATA.titulo;
$("sub").textContent = `${DATA.fecha}${DATA.modo ? " · modo " + DATA.modo : ""} · las casillas y comentarios se guardan en este navegador`;
if (DATA.resumen) { $("resumen").innerHTML = DATA.resumen; $("resumen").classList.remove("hide"); }

const root = $("root");
for (const it of DATA.items) {
  const div = document.createElement("div"); div.className = "item"; div.dataset.id = it.id;
  const url = resolveLink(DATA.baseUrl, it.link);
  const probar = url || it.comando
    ? `<div class="probar">${url ? `<a href="${url}" target="_blank" rel="noopener">${it.linkTexto || "Probar aquí"} →</a><small>${url}</small>` : ""}${it.comando ? `<span>Comando: <code>${it.comando}</code></span>` : ""}</div>`
    : "";
  div.innerHTML =
    `<input type="checkbox" id="c-${it.id}" aria-label="Probado: ${String(it.titulo).replace(/<[^>]*>/g, "").replace(/"/g, "&quot;")}">` +
    `<h3><label for="c-${it.id}">${it.titulo}</label><span class="tag t-${it.estado}">${ESTADO[it.estado] || it.estado}</span></h3>` +
    `<div class="body">` +
      (it.paso ? `<div class="paso"><b>Qué pasó:</b> ${it.paso}</div>` : "") +
      (it.pasos && it.pasos.length ? `<b>Cómo probarlo:</b><ol>${it.pasos.map((x) => `<li>${x}</li>`).join("")}</ol>` : "") +
      (it.debe ? `<div class="exp"><b>Debe pasar:</b> ${it.debe}</div>` : "") +
      probar +
      `<textarea placeholder="Tus comentarios sobre este ítem (qué mejorar, qué falló, qué cambiar). Puedes pegar capturas con Ctrl+V." aria-label="Comentarios del ítem ${it.id}"></textarea><div class="thumbs"></div>` +
    `</div>`;
  root.appendChild(div);
  const box = div.querySelector("input"), note = div.querySelector("textarea");
  box.checked = !!state.checks[it.id];
  note.value = state.notes[it.id] || "";
  box.addEventListener("change", () => { state.checks[it.id] = box.checked; save(); refresh(); });
  note.addEventListener("input", () => { state.notes[it.id] = note.value; save(); });
  renderThumbs(it.id);
}

// ---- Capturas pegadas (Ctrl+V) en los comentarios ----
function itemEl(id) { return document.querySelector(`.item[data-id="${id}"]`); }
function renderThumbs(id) {
  const box = itemEl(id) && itemEl(id).querySelector(".thumbs");
  if (!box) return;
  const imgs = state.images[id] || [];
  box.innerHTML = "";
  imgs.forEach((src, n) => {
    const fig = document.createElement("figure");
    fig.innerHTML = `<img alt="Captura ${n + 1}" src="${src}"><button type="button" class="x" aria-label="Quitar captura">×</button>`;
    fig.querySelector("img").addEventListener("click", () => fig.classList.toggle("big"));
    fig.querySelector(".x").addEventListener("click", () => { state.images[id].splice(n, 1); save(); renderThumbs(id); });
    box.appendChild(fig);
  });
}
function fileToDataUrl(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const { w, h } = fitSize(img.naturalWidth, img.naturalHeight, max);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("imagen no válida")); };
    img.src = url;
  });
}
document.addEventListener("paste", async (e) => {
  const cd = e.clipboardData; if (!cd) return;
  const files = Array.from(cd.files).filter((f) => /^image\/(png|jpeg|webp|gif)$/.test(f.type));
  if (!files.length) return; // texto: pegado normal
  const t = e.target;
  const editable = t && (t.isContentEditable || t.tagName === "INPUT" || t.tagName === "TEXTAREA");
  if (editable && (cd.types.includes("text/plain") || cd.types.includes("text/html"))) return;
  // Ítem destino: el del campo enfocado o, si no, el que tiene el mouse encima.
  const item = (t && t.closest && t.closest(".item")) || [...document.querySelectorAll(".item")].find((d) => d.matches(":hover"));
  if (!item) return;
  e.preventDefault();
  const id = item.dataset.id;
  for (const f of files) {
    try {
      (state.images[id] = state.images[id] || []).push(await fileToDataUrl(f));
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) { state.images[id].pop(); say("No cabe en el navegador: descarga los comentarios y quita capturas."); continue; }
      renderThumbs(id); say("Captura agregada.");
    } catch (_) { say("No se pudo leer la imagen pegada."); }
  }
});

const only = $("onlyPending");
function refresh() {
  const total = DATA.items.length; let done = 0;
  document.querySelectorAll(".item").forEach((div) => {
    const on = div.querySelector("input").checked;
    if (on) done++;
    div.classList.toggle("done", on);
    div.classList.toggle("hide", only.checked && on);
  });
  $("count").textContent = `${done} de ${total} probadas`;
  $("fill").style.width = total ? `${Math.round((done / total) * 100)}%` : "0%";
}
only.addEventListener("change", refresh);

let msgTimer;
function say(text) { $("msg").textContent = text; clearTimeout(msgTimer); msgTimer = setTimeout(() => ($("msg").textContent = ""), 4000); }

$("copy").addEventListener("click", async () => {
  const text = buildCommentsText(DATA, state);
  const hasImgs = Object.values(state.images).some((a) => a && a.length);
  try { await navigator.clipboard.writeText(text); say(hasImgs ? "Copiado. Las capturas no van en el texto: usa «Descargar»." : "Copiado. Pégalo en el chat."); }
  catch (_) {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); say("Copiado. Pégalo en el chat."); } catch (__) { say("No se pudo copiar: usa «Descargar»."); }
    t.remove();
  }
});
$("download").addEventListener("click", () => {
  const json = JSON.stringify(buildCommentsJson(DATA, state, new Date().toISOString()), null, 2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  a.download = `comentarios-${DATA.tema}-${DATA.fecha}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  say(`Descargado como comentarios-${DATA.tema}-${DATA.fecha}.json`);
});
// Dos pasos en vez de un diálogo nativo: el primer clic arma, el segundo borra.
const resetBtn = $("reset"); let armed = null;
resetBtn.addEventListener("click", () => {
  if (!armed) {
    resetBtn.textContent = "¿Seguro? Pulsa otra vez";
    armed = setTimeout(() => { armed = null; resetBtn.textContent = "Reiniciar marcas y comentarios"; }, 3000);
    return;
  }
  clearTimeout(armed); armed = null; resetBtn.textContent = "Reiniciar marcas y comentarios";
  state = { checks: {}, notes: {}, images: {} }; save();
  document.querySelectorAll(".item").forEach((div) => { div.querySelector("input").checked = false; div.querySelector("textarea").value = ""; div.querySelector(".thumbs").innerHTML = ""; });
  refresh();
});
refresh();
</script>
